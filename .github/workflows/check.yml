name: Verify floorplan skill
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      FLOORPLAN_THREE_ROOT: outputs/test-runtime/node_modules/three
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --prefix outputs/test-runtime three@0.160.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r skills/floorplan-image/scripts/requirements-furniture.txt
      - run: python -m unittest discover -s tests -v
      - run: pip install 'playwright>=1.48,<2'
      - run: python -m playwright install --with-deps chromium
      - run: python tests/browser_multi_floor.py
      - run: python tests/browser_smoke.py
      - run: python tests/browser_furniture_assets.py
      - run: python tests/browser_furniture_assets.py --targeted
      - run: python tests/browser_furniture_assets.py --bad-png
      - run: python tests/browser_material_editor.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-verification
          path: |
            outputs/
            !outputs/test-runtime/**
